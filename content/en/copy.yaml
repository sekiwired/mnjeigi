services:
  eyebrow: Services
  title: "What can I help you with?"
  intro: "Through independent audit, strategic counsel or direct intervention, I work across business, organization, operations and technology. Each is a complete engagement, and none is a prerequisite for another. We set the objective and the scope of my involvement together."
  discuss: Discuss this
  output_label: You get
  lead:
    topic: fractional-cto
    tag: Lead
    title: Fractional CTO
    tagline: "The technical system of your company, designed and steered by a senior CTO, part-time."
    points:
      - "Technology strategy and IT budget, decided with the leadership team"
      - "Architecture owned: core-model, technical choices, vendor selection"
      - "Team built: technical recruitment, development and deployment processes"
      - "A successor trained to ensure continuity"
    format: "Scope and cadence agreed together"
  ai:
    eyebrow: Artificial intelligence
    title: "AI changes the system, not only the tools."
    intro: "Once AI produces part of the work, who decides, who checks and what it costs all change. These three engagements address it at that level: meaning, responsibility, quality, cost and capacity to evolve."
    offers:
      - topic: ai-audit
        tag: Assess
        title: AI Audit
        question: "Where are AI value, quality and control being lost?"
        points:
          - "Delivery economics: where AI output moves waiting, correction, verification and operating cost"
          - "Meaning, responsibility and authority: whether intent, commitments and scope keep a shared meaning across stakeholders, tools and decisions"
          - "Quality and future change: what success evidence establishes, and what remains unknown about maintainability and evolution"
        output: "Findings and a prioritized decision basis."
      - topic: ai-training
        tag: Teach
        title: AI Training
        question: "Which professional judgment must our people develop and retain?"
        points:
          - "Professional judgment in AI interactions: recognizing shifts of meaning, superficial expertise and persuasive claims of completion"
          - "Continuity and informed delegation: the judgment each role retains"
          - "AI economics and evidence literacy: telling activity from delivery, quality, risk and lifetime cost"
        output: "Role-specific capability and learning outcomes."
      - topic: ai-transformation
        tag: Transform
        title: AI Process Transformation
        question: "How must our organization change to realize value durably?"
        points:
          - "Alignment of intent, decisions and delivery: how business intent becomes shared obligations and accepted outcomes"
          - "Capacity, quality and pace: verification capacity adapted to increased production"
          - "Enterprise architecture and evolution: business capabilities, legacy integration and future choices under economic and governance constraints"
        output: "Agreed operating and architectural changes, connected to business outcomes."
  catalogue:
    eyebrow: Focused engagements
    title: "Scoped work, defined format."
    intro: "I help teams move faster with clearer architecture, stronger delivery, and simpler systems."
    cta: Contact me about this

proof:
  eyebrow: Track record
  title_lines: ["18 years.", "{logo_count} organizations."]
  lede: "I have been both a consultant for large enterprises and a product builder — founding companies, leading tech and operations, and delivering critical systems at scale. I understand the relationship between business needs and technical constraints, which lets me cut noise and focus on what moves the needle."
  wall_title: They trusted me with their projects
  wall_caption: "Clients, employers and companies I helped build."
  cases_eyebrow: Selected missions
  cases:
    - mission: THALES GROUP
      kicker: Group-wide standard
      context: "Sole Git reference and global point of contact for the entire Thales Group. Wrote the Group's Software Configuration Management standard, defined the enterprise-scale IBM GCL → Git migration strategy, designed infrastructure architectures, and delivered L3 technical support across all Thales entities worldwide."
      figures:
        - {value: "5", label: "countries trained: AU, DE, NO, UK, US"}
      quotes:
        - {has: "standard was defined", mark: "was defined for the Thales Group"}
        - {has: "migration guide", mark: "published and distributed"}
        - {has: "Train-the-trainer", mark: "delivered"}
        - {has: "successor", mark: "A successor was trained"}
    - mission: SANOFI
      kicker: Critical system
      context: "Defined and implemented the application core-model for EU pharmaceutical product traceability — collecting real-time manufacturing data from 400 production sites, detecting anomalies and counterfeits, and notifying health authorities for 35 billion transactions per year."
      figures:
        - {value: "35B+", label: "transactions per year, designed and validated"}
        - {value: "400", label: "factories worldwide"}
        - {value: "6", label: "months to deliver the project"}
      quotes:
        - {has: "high-availability", mark: "Designed and validated"}
        - {has: "TOGAF", mark: "Integrated"}
        - {has: "real load", mark: "validating the architecture under real load conditions"}
        - {has: "Performance commitments", mark: "validated by the client and deadlines were met"}
    - mission: MELUDIA
      kicker: Company turnaround
      context: "After 7 years and near-total staff reduction, the founders mandated me to restructure, transform, and reduce operational and technical costs — and to lead full production of a new mobile application from spec to delivery."
      figures:
        - {value: "5×", label: "lower cloud costs"}
        - {value: "3×", label: "load capacity"}
        - {value: "168", label: "countries, 15,000+ users"}
      quotes:
