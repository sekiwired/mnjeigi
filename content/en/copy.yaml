        - {has: "technical debt", mark: "reduced technical debt on the legacy by 60%"}
        - {has: "6 technical profiles", mark: "Recruited"}
        - {has: "Customer Support", mark: "reduced average ticket resolution time by a factor of 3"}
    - mission: L'ORÉAL GROUPE
      kicker: Group strategy
      context: "Two strategic engagements at Group headquarters: defining the 3-year global integration roadmap (ETI/SOA) and building the RFP for vendors; then designing a custom Agile/Waterfall hybrid project management framework as the Group's engineering standard, in collaboration with Ernst & Young."
      figures:
