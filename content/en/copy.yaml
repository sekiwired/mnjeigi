approach:
  eyebrow: How it works
  title: "You always know where we are, what's next, and how we measure success."
  lede: "A structured process from first conversation to delivery. Every engagement follows the same six steps — whether it's a one-week audit or a six-month operational mandate."
  steps_title: The six steps
  steps:
    - {num: "01", title: "Exchange & Discussion", desc: "Context, goals, constraints, and success criteria."}
    - {num: "02", title: "Scope Refining", desc: "Define boundaries, risks, and dependencies."}
    - {num: "03", title: "Proposal", desc: "Plan, timeline, staffing, and budget options."}
    - {num: "04", title: "Validation", desc: "Confirm scope, delivery model, and KPIs."}
    - {num: "05", title: "Execution", desc: "Build, test, run, and transfer with clear governance."}
    - {num: "06", title: "Metrics & Documentation", desc: "Measurable impact, handover docs, and continuous improvement."}
  includes_title: Every engagement includes
  includes:
    - {name: Full transparency, desc: "You see progress, blockers, and decisions in real time"}
    - {name: Written documentation, desc: "Scope, decisions, and outcomes are always recorded"}
    - {name: Structured handover, desc: "Everything is transferable to your team at the end"}
    - {name: Measurable outcomes, desc: "Success criteria are defined upfront and tracked"}
  quote: "Structured handover. You run it when I leave."
  cta_text: "Step 01 is a conversation."
  cta: Start it

about:
  eyebrow: About
  title: "I'm Julien Grimal."
  bio: 'I am 41 and have been passionate about apps and computing since I was 12. I graduated from <a href="https://www.telecom-sudparis.eu/en/about-us/about-telecom-sudparis/" target="_blank" rel="noopener">Telecom SudParis</a> in Information and Network Security, and I have 18 years of professional experience. I have built companies, products, and teams, and I still build systems for fun.'
  roles_label: "I am"
  roles: ["a System Designer", "versatile", "a Digital Architect", "a Project Manager", "an Entrepreneur", "a full-stack dev", "a DevOps expert", "a Coach", "a Consultant", "a problem solver", "an innovator", "efficient"]
  principles_title: "How I think & work"
  principles:
    - title: Everything is movement
      text: "Digital and business trends are changing at an incredible pace. Building a system while assuming every part will change, and making evolution part of its <strong>DNA</strong>, is an <strong>expertise</strong> I have gathered."
    - title: Out of the box thinking
      text: "Used to <strong>build</strong> systems from the ground up and audit complex environments, I bring <strong>creativity</strong> to reduce complexity while planning <strong>for the future</strong>."
    - title: Simpler is better
      text: "I prefer building contexts where problems do not exist, rather than adding layers that become harder to <strong>document</strong>, <strong>maintain</strong> and pass along."
    - title: Full package
      text: "Together we tailor what is best for your <strong>needs</strong> — from <strong>strategic planning</strong> and <strong>product design</strong> to architecture, build, run, and audits."
