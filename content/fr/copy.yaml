  eyebrow: [Julien Grimal, System Designer, CTO à temps partagé]
  title_lines: ["System Design,", "de l'intention au"]
  title_accent: "résultat."
  sub: "Une organisation, un produit, un programme fonctionnent chacun comme un système : des équipes, des décisions, des processus et des technologies qui dépendent les uns des autres. Je vous aide à comprendre les situations complexes, à décider en connaissance de cause et à mener vos initiatives jusqu'à leur aboutissement."
  cta: Parlons de votre projet
  cta_secondary: Voir les références
  credential: "18 ans. Thales, Sanofi et L'Oréal à l'échelle du groupe. CTO puis COO d'une entreprise en restructuration. Fondateur."

