services:
  eyebrow: Services
  title: "En quoi puis-je vous être utile ?"
  intro: "Audit indépendant, conseil stratégique ou intervention directe, sur le métier, l'organisation, les opérations et la technologie. Chaque mission se suffit à elle-même et n'en impose aucune autre. L'objectif et le périmètre de ma mission se définissent avec vous."
  discuss: En discuter
  output_label: Vous obtenez
  lead:
    topic: fractional-cto
    tag: Diriger
    title: CTO à temps partagé
    tagline: "Le système technique de votre entreprise, conçu et piloté par un CTO expérimenté, à temps partagé."
    points:
      - "Stratégie technologique et budget IT, arrêtés avec la direction"
      - "Architecture portée : core-model, choix techniques, sélection des prestataires"
      - "Équipe constituée : recrutement technique, processus de développement et de déploiement"
      - "Un successeur formé pour assurer la continuité"
    format: "Périmètre et rythme définis ensemble"
  ai:
    eyebrow: Intelligence artificielle
    title: "Avec l'IA, c'est tout le système qui change, pas seulement les outils."
    intro: "Dès que l'IA produit une partie du travail, qui décide, qui contrôle et ce que cela coûte : tout change. Ces trois missions l'abordent à ce niveau : sens, responsabilité, qualité, coût et capacité d'évolution."
    offers:
      - topic: ai-audit
        tag: Évaluer
        title: Audit IA
        question: "Vos équipes produisent plus de code avec l'IA. Pourquoi les livraisons ne vont-elles pas plus vite ?"
        points:
          - "Où le goulet s'est déplacé : revue, tests, mise en production"
          - "Ce que les agents ont modifié dans votre architecture et que les tests au vert ne montrent pas"
          - "Qui valide quoi, sur quelles preuves, quand les synthèses sont rédigées par des agents"
        output: "Des constats et une base de décision priorisée."
      - topic: ai-training
        tag: Former
        title: Formation IA
        question: "Vos équipes relisent désormais plus qu'elles n'écrivent. Savent-elles encore voir ce qui a changé ?"
        points:
          - "Lire une production d'agent : repérer un sens, un périmètre ou une interface qui a glissé derrière une réponse convaincante"
          - "Savoir quand cesser de corriger et restructurer, avant que la relecture ne devienne une reconstruction"
          - "Déléguer à une IA assistante ou agentique sans vider chaque validation de son sens"
        output: "Des compétences par rôle, avec des critères que chacun applique en autonomie."
      - topic: ai-transformation
        tag: Transformer
        title: Transformation des processus par l'IA
        question: "Les agents arrivent à grande échelle. Votre chaîne de livraison est-elle prête à les absorber ?"
        points:
          - "Une capacité de revue, de test et de mise en production à la mesure de ce que produisent les agents"
          - "Des règles claires de responsabilité et de coût pour ce que les agents construisent"
          - "Une structure posée avant la génération, pour que l'architecture, les données et la sécurité restent cohérentes"
        output: "Des évolutions d'organisation et d'architecture convenues, reliées aux résultats métier."
  catalogue:
    eyebrow: Missions ciblées
    title: "Un périmètre cadré, un format défini."
    intro: "J'aide les équipes à aller plus vite avec une architecture claire, une delivery solide, et des systèmes plus simples."
    cta: Me contacter pour ce service

proof:
  eyebrow: Références
  title_lines: ["18 ans.", "{logo_count} organisations."]
  lede: "J'ai été des deux côtés — consultant pour de grands groupes, fondateur d'entreprise et concepteur de produits. J'ai dirigé des équipes tech et ops et livré des systèmes critiques à grande échelle. Je comprends la relation entre besoins métiers et contraintes techniques, ce qui me permet d'éliminer le superflu et de me concentrer sur ce qui génère un impact réel."
  wall_title: Ils m'ont confié leurs projets
  wall_caption: "Clients, employeurs et sociétés que j'ai contribué à construire."
  cases_eyebrow: Missions choisies
  cases:
    - mission: THALES GROUP
      kicker: Standard à l'échelle du groupe
      context: "Seule référence Git et point de contact mondial pour l'ensemble du Groupe Thales. Rédaction du standard SCM du Groupe, définition de la stratégie de migration IBM GCL → Git à l'échelle entreprise, conception des architectures d'infrastructure, et support technique L3 auprès de toutes les entités Thales dans le monde."
      figures:
        - {value: "4,9", icon: star, label: "note des formations"}
        - {value: "120", icon: people, label: "personnes formées"}
        - {value: "22 000", icon: engineers, label: "ingénieurs concernés"}
      quotes:
        - {has: "a été défini", mark: "a été défini pour le groupe Thales"}
        - {has: "guide de migration", mark: "publié et distribué"}
        - {has: "Formation de formateurs", mark: "Formation de formateurs"}
        - {has: "successeur", mark: "Un successeur a été formé"}
    - mission: SANOFI
      kicker: Système critique
      context: "Définition et implémentation du core-model applicatif pour la traçabilité pharmaceutique européenne — collecte en temps réel des données de fabrication de 400 sites de production, détection d'anomalies et de contrefaçons, notification des autorités sanitaires pour 35 milliards de transactions par an."
      figures:
        - {value: "35 Md+", icon: transactions, label: "de transactions par an, conçu et validé"}
        - {value: "400", icon: factory, label: "usines dans le monde"}
        - {value: "6", icon: calendar, label: "mois pour livrer le projet"}
      quotes:
        - {has: "haute disponibilité", mark: "Conception, validation et intégration"}
        - {has: "TOGAF", mark: "Intégration"}
        - {has: "charge réelles", mark: "validant l'architecture sous des conditions de charge réelles"}
        - {has: "engagements de performance", mark: "validés par le client et les délais respectés"}
    - mission: MELUDIA
      kicker: Redressement d'entreprise
      context: "Après 7 ans et une quasi-totalité des effectifs réduits, les fondateurs m'ont mandaté pour restructurer, transformer et réduire les coûts opérationnels et techniques — et pour piloter la production complète d'une nouvelle application mobile de bout en bout."
      figures:
        - {value: "5", icon: cost, trend: down, suffix: "×", label: "coûts cloud"}
        - {value: "3", icon: load, trend: up, suffix: "×", label: "capacité de charge"}
        - {value: "168", icon: globe, label: "pays"}
        - {value: "15 000+", icon: users, label: "utilisateurs"}
      quotes:
        - {has: "Azure vers AWS", mark: "réduisant les coûts par un facteur 5"}
        - {has: "dette technique", mark: "réduction de 60% de la dette technique"}
        - {has: "6 profils", mark: "Recrutement"}
        - {has: "Customer Support", mark: "division par 3 du temps moyen de résolution des tickets"}
    - mission: L'ORÉAL GROUPE
      kicker: Stratégie groupe
      context: "Deux missions stratégiques au siège du Groupe : définition de la roadmap d'intégration groupe sur 3 ans (ETI/SOA) et construction de l'appel d'offres fournisseurs ; puis conception d'un référentiel méthodologique Agile/Waterfall hybride comme standard d'ingénierie du Groupe, en collaboration avec Ernst & Young."
      figures:
        - {value: "3", icon: plan, unit: ans, label: "de plan d'intégration, validé par le DSI Groupe"}
      quotes:
