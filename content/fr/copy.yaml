    labels: {context: Contexte, challenges: Enjeux, results: Résultats, stack: Stack}
    open: Lire la mission
  cta_title: "Et votre projet ?"
  cta: Parlons de votre projet

approach:
  eyebrow: Comment cela se passe
  title: "Vous savez toujours où nous en sommes, ce qui vient ensuite, et comment nous mesurons le succès."
  lede: "Un processus structuré de la première conversation à la livraison. Chaque mission suit les mêmes six étapes — qu'il s'agisse d'un audit d'une semaine ou d'un mandat opérationnel de six mois."
  steps_title: Les six étapes
  steps:
    - {num: "01", title: "Échange & Discussion", desc: "Contexte, objectifs, contraintes et critères de succès."}
    - {num: "02", title: "Affinage du scope", desc: "Définition des limites, risques et dépendances."}
    - {num: "03", title: "Proposition", desc: "Plan, timing, staffing et options budgétaires."}
    - {num: "04", title: "Validation", desc: "Alignement sur le scope, le modèle de delivery et les KPIs."}
    - {num: "05", title: "Exécution", desc: "Build, tests, run et transfert avec une gouvernance claire."}
    - {num: "06", title: "Métriques & Documentation", desc: "Impact mesuré, documents de transfert, amélioration continue."}
  includes_title: Chaque mission inclut
  includes:
    - {name: Transparence totale, desc: "Vous voyez l'avancement, les blocages et les décisions en temps réel"}
    - {name: Documentation écrite, desc: "Le périmètre ainsi que les décisions et résultats sont toujours consignés"}
    - {name: Transmission structurée, desc: "Tout est transférable à votre équipe en fin de mission"}
    - {name: Résultats mesurables, desc: "Les critères de succès sont définis en amont et suivis"}
  quote: "Passation structurée. Vous reprenez la main à mon départ."
  cta_text: "L'étape 01 est une conversation."
  cta: Commençons

about:
  eyebrow: À propos
  title: "Je suis Julien Grimal."
  bio: 'J''ai 41 ans et je suis passionné par les apps et l''informatique depuis l''âge de 12 ans. Diplômé de <a href="https://www.telecom-sudparis.eu/en/about-us/about-telecom-sudparis/" target="_blank" rel="noopener">Telecom SudParis</a> en sécurité des systèmes d''information, j''ai 18 ans d''expérience professionnelle. J''ai créé des entreprises, des produits et des équipes, et je continue à construire des systèmes pour le plaisir.'
  roles_label: "Je suis"
  roles: ["un System Designer", "polyvalent", "un Architecte digital", "un Chef de projet", "un Entrepreneur", "un développeur full-stack", "un expert DevOps", "un Coach", "un Consultant", "un solveur de problèmes", "un innovateur", "efficace"]
  principles_title: "Mon approche"
  principles:
    - title: Tout est mouvement
      text: "Les tendances business et digitales évoluent à une vitesse folle. Concevoir un système en pensant que chaque partie va changer, et faire de l'évolution une composante de son <strong>ADN</strong>, c'est une <strong>expertise</strong> que j'ai acquise."
    - title: Changer de paradigme
      text: "Habitué à <strong>construire</strong> des systèmes from scratch à auditer des environnements complexes, j'apporte la <strong>créativité</strong> nécessaire pour réduire la complexité tout en préparant <strong>l'avenir</strong>."
    - title: "Plus simple, c'est mieux"
      text: "Je préfère créer un contexte où le problème n'existe pas plutôt que d'ajouter des couches difficiles à <strong>documenter</strong>, <strong>maintenir</strong> et transmettre."
    - title: Un accompagnement complet
      text: "De la <strong>planification stratégique</strong> au <strong>product design</strong>, en passant par l'architecture, le build, le run et les audits — Je peux vous accompagner sur l'ensemble de la chaîne en fonction <strong>besoins</strong>"
  facts:
    - {label: Formation, lines: ["Telecom SudParis", "Ingénieur en Sécurité des Systèmes d'Information — 2008"]}
    - {label: Langues, lines: ["Français — Langue maternelle", "Anglais — Professionnel · C2"]}
  reference:
    title: Là où j'ai été la référence
    rows:
      - {skill: "Git & gestion de configuration logicielle", proof: "Standard du Groupe Thales"}
      - {skill: "Architecture d'entreprise", proof: "Sanofi, 35 Md+ de transactions par an"}
      - {skill: "Migration cloud & coûts", proof: "Meludia, coûts divisés par 5"}
      - {skill: "Appels d'offres & sélection de prestataires", proof: "L'Oréal Groupe"}
  inventory_title: L'inventaire complet
  capabilities_title: Savoir-faire
  cv: {label: Télécharger le CV, href: "resume/GRIMAL_FR.pdf"}
  linkedin: {label: LinkedIn, href: "https://www.linkedin.com/in/juliengrimal"}

