capabilities:
- title: Opérations
  points:
  - Cartographier et optimiser les processus métier pour éliminer les blocages
  - Définir des KPIs, mettre en place des boucles de feedback, piloter par la data
  - 'Lean management : standardiser, réduire les gaspillages, responsabiliser'
- title: Conseil & Audit
  points:
  - Rédiger et relire des RFP/RFQ pour web/app/infra/mobile
  - Auditer les processus de livraison et d'exploitation afin de réduire les risques
  - Réconcilier la roadmap technique avec les objectifs métier
- title: Formation
  points:
  - Formations sur mesure pour équipes produit/tech/ops
  - Langage commun et pratiques alignées
  - Faire le pont entre les contraintes métier et la réalité technique
- title: Produit
  points:
  - Définir les specs, recruter l'équipe et piloter la construction
  - Livrer des produits web et mobile de bout en bout
  - Gestion de la feuille de route produit
- title: Delivery
  points:
  - Définir et piloter le cycle de conception/déploiement/exploitation de bout en bout
  - Mettre en place la cadence de release, les quality gates et les rituels d'équipe
  - Libérer les points de blocage assurer la mise en production des livrables
- title: Infrastructure
  points:
  - Concevoir, construire ou auditer des stacks complètes
  - Planifier des migrations et dimensionner l'architecture
  - Améliorer fiabilité, scalabilité et coûts
